pre-commit:
  parallel: true
  commands:
    compile:
      glob: "*.el"
      run: make compile
    test:
      glob: "*.el"
      run: make test
    format-check:
      glob: "*.el"
      run: make format-check
    lint-checkdoc:
      glob: "*.el"
      run: make lint-checkdoc
    coverage-check:
      glob: "*.el"
      run: make coverage-check
    benchmark-check:
      glob: "*.el"
      run: make benchmark-check
